name: skill-catalog-guardrails

# The catalog is only a reliable engine if its invariants are enforced, not
# just documented. This job is the gate: it fails the build on a duplicate
# frontmatter name, an oversized SKILL.md, an over-length description, a broken
# reference link, a stale or dangling alias, an active count over the cap, or
# raw/reconstructive book content anywhere in the repository. It also runs the
# plugin hook tests and fails when an active skill lacks its Evidence Produced
# contract.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: python -m pip install --requirement requirements-ci.txt

      # Enforcing mode: any finding fails the build (no --report-only).
      - name: Run skill catalog guardrails
        run: python -X utf8 scripts/skill_catalog_guardrails.py

      - name: Test source-ingestion guardrails
        run: python -X utf8 -m unittest tests/test_skill_catalog_guardrails.py

      - name: Test repository validators and negative cases
        run: python -X utf8 -m pytest tests -q -p no:cacheprovider

      # Routing smoke test: fails if any fixtured task's expected skill falls
      # outside its top-N matches - i.e. a description drifted into ambiguity.
      # --min-rank1 is the ratchet floor (measured p@1 minus 2 points; raise it,
      # never lower it - chwezi-engine-agents evals/routing/baseline.json).
      # --lint-fixtures rejects prompts that leak the expected slug or copy the
      # description. Owned negatives run on every invocation. (M10-03)
      - name: Run routing smoke test
        run: python -X utf8 scripts/routing_smoke_test.py --min-rank1 88 --lint-fixtures

      - name: Run in-engine routing collision gate
        run: python -X utf8 scripts/routing_smoke_test.py --collisions --collision-gate --threshold 0.5

      - name: Validate engine control plane
        run: python -X utf8 scripts/validate_engine_control_plane.py

      # The plugin's PreToolUse hook blocks destructive shell commands; its
      # pattern tests and hook-configuration tests must pass on every change.
      - name: Test plugin hooks
        run: node hooks/test-destructive-bash-gate.js && node hooks/test-plugin-hook-config.js

      # Enforcing: a missing or malformed ## Evidence Produced section in any
      # active skill (skills/ and 00-meta-initialization/) fails the build.
      - name: Validate evidence declarations
        run: python -X utf8 skills/sdlc-meta/skill-writing/scripts/contract_gate.py --all
