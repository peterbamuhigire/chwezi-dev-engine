schema_version: "1.0"
engine_id: chwezi-dev-engine
display_name: Chwezi Dev Engine
contract_version: "1.0"
version: "1.1.0"
router:
  path: AGENTS.md
skills:
  discovery_glob: skills/**/SKILL.md
validation:
  - id: release-gate
    command: >-
      python scripts/validate_engine_control_plane.py
    working_directory: .
    platforms:
      - windows
      - linux
      - macos
  - id: catalogue-gate
    command: python -X utf8 scripts/skill_catalog_guardrails.py
    working_directory: .
    platforms: [windows, linux, macos]
  - id: routing-gate
    command: python -X utf8 scripts/routing_smoke_test.py
    working_directory: .
    platforms: [windows, linux, macos]
agent_integration:
  supported_modes: [full, sequential, read_only, not_assessed]
  local_context_files: [AGENTS.md, .skills-engine/AGENTS-INTEGRATION.md]
  mcp_safe_tools: [discover_engine, read_router, read_skill, validate_documented_checks]
  approval_required_for: [write_files, pull, update, publish, external_message]
  forbidden_operations: [git_reset, git_clean, force_push, arbitrary_shell, broad_delete]
  fork_behavior: inspect_local_router_without_inventing_validators
source_of_truth:
  router: AGENTS.md
  skills: skills/**/SKILL.md
  references: references/**
plugin_exclusions:
  - path: "."
    reason: "repository-level router SKILL.md; the plugin exposes the routed skills under skills/, and the router is read through AGENTS.md"
  - path: "00-meta-initialization"
    reason: "project-initialisation router outside skills/; counted active by the dev catalogue (167) but loaded by path at project start, not shipped as a plugin skill; the generator runs with --root skills"
  - path: "00-meta-initialization/new-project"
    reason: "project scaffold step under the initialisation router; same reason as 00-meta-initialization"
invariants:
  - id: book-extraction-ban
    phrase: "Book extractions, book summaries and chapter-by-chapter notes must never be"
  - id: not-assessed
    phrase: "Missing execution, render, production, source, reviewer, or stakeholder evidence is `NOT ASSESSED`, never a pass."
invariant_exemptions:
  british-english: "No British English output rule exists in this engine's router (AGENTS.md, README.md, rules/); adding one is new doctrine outside M10-02 scope. Recorded for the orchestrator."
