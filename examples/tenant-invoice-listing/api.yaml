openapi: 3.1.0
info:
  title: Tenant invoice listing example
  version: 1.0.0
  description: Read-only illustrative contract. Authentication and tenant are established by the server session.
paths:
  /invoices:
    get:
      summary: List invoices visible to the authenticated tenant
      parameters:
        - in: query
          name: q
          schema:
            type: string
            maxLength: 120
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Private, tenant-scoped result page
          headers:
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, number, currency, amount_minor, customer]
                      properties:
                        id: { type: string, pattern: '^[0-9]+$' }
                        number: { type: string }
                        currency: { type: string, minLength: 3, maxLength: 3 }
                        amount_minor: { type: string, pattern: '^-?[0-9]+$' }
                        customer: { type: string }
        '400': { description: Invalid listing input }
        '401': { description: No authenticated session }
        '403': { description: Invoice permission denied }
